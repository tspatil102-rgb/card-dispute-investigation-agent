spring.application.name=card-dispute-investigation-agent

# Database Configuration
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Application Configuration
app.name=Card Dispute Investigation & Resolution Agent
app.version=1.0.0

# LLM Configuration (OpenAI)
# For local testing, set to any valid OpenAI key format
# In production, use environment variables with export SPRING_APPLICATION_JSON or similar
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=gpt-3.5-turbo
llm.openai.timeout-seconds=30

# LLM Configuration (Vertex AI)
# Using Google Cloud credentials
# Set via: export GOOGLE_APPLICATION_CREDENTIALS='<path-to-service-account-key.json>'
# Or use Application Default Credentials (gcloud auth application-default login)
llm.vertexai.project-id=${GCP_PROJECT_ID:}
llm.vertexai.region=${GCP_REGION:asia-south1}
llm.vertexai.model=${VERTEX_AI_MODEL:gemini-2.5-flash}
llm.vertexai.timeout-seconds=30

# Legacy Gemini configuration (deprecated - kept for backward compatibility)
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=gemini-2.5-flash
llm.gemini.timeout-seconds=30

# Backward-compatible legacy aliases
llm.openai.timeout-seconds=30

# LLM Guards - input/output validation
llm.max-output-retries=2
llm.prompt-injection-check=true